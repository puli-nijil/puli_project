<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Book Exchange System</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f4f4f4;
}

header{
    background:#0f3969;
    color:white;
    text-align:center;
    padding:10px;
}

nav{
    background:#0e3c68;
    padding:15px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:15px;
    font-weight:bold;
}

nav a:hover{
    color:yellow;
}

.container{
    width:400px;
    background:white;
    margin:50px auto;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

h2{
    text-align:center;
    color:#0f3969;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    background:#27ae60;
    color:white;
    border:none;
    padding:12px;
    border-radius:5px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1f8c4c;
}

p{
    text-align:center;
}

a{
    color:#0f3969;
    text-decoration:none;
    font-weight:bold;
}

footer{
    background:#133b70;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:40px;
}

</style>

</head>

<body>

<header>

<h1>Book Exchange System</h1>

<p>Exchange Books | Save Money | Read More</p>

</header>

<nav>

<a href="index.html">Home</a>

<a href="register.html">Register</a>

<a href="login.html">Login</a>

</nav>

<div class="container">

<h2>User Registration</h2>

<form action="register.php" method="POST">

<label>Full Name</label>

<input
type="text"
name="fullname"
placeholder="Enter Full Name"
required>

<label>Email</label>

<input
type="email"
name="email"
placeholder="Enter Email"
required>

<label>Phone Number</label>

<input
type="text"
name="phone"
placeholder="Enter Phone Number"
required>

<label>Address</label>

<input
type="text"
name="address"
placeholder="Enter Address"
required>

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>
<input type="submit" name="submit" value="Register" class="green-btn">

<style>
.green-btn {
    background-color: green;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
}

.green-btn:hover {
    background-color: darkgreen;
}
</style>
</form>

<p>

Already have an account?

<a href="login.html">

Login Here

</a>

</p>

</div>

<footer>

<p>© 2026 Book Exchange System</p>

</footer>

</body>
</html>
